document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-->\n\n<style>\n  *, *::before, *::after { box-sizing: border-box; }\n  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141f; }\n  body { font-family: \"Space Grotesk\", system-ui, -apple-system, sans-serif; color: #fdf6ea; -webkit-tap-highlight-color: transparent; }\n  a { color: #f0c04a; }\n  a:hover { color: #ffd772; }\n  #stage { position: fixed; inset: 0; }\n  canvas { display: block; width: 100%; height: 100%; }\n\n  /* ---------- HUD ---------- */\n  #hud { position: fixed; inset: 0; pointer-events: none; padding: 22px clamp(16px, 3vw, 40px); display: flex; flex-direction: column; justify-content: space-between; }\n  .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; }\n  .panel { background: rgba(16, 22, 38, 0.42); backdrop-filter: blur(8px); border: 1px solid rgba(253, 246, 234, 0.16); border-radius: 14px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 118px; }\n  .label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(253, 246, 234, 0.6); }\n  .value { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }\n  .value small { font-size: 13px; font-weight: 500; opacity: 0.6; margin-left: 3px; }\n  #lives { display: flex; gap: 7px; margin-top: 5px; }\n  .pip { width: 13px; height: 18px; border-radius: 4px 4px 5px 5px; background: #f0c04a; box-shadow: 0 0 10px rgba(240, 192, 74, 0.5); position: relative; }\n  .pip::before { content: \"\"; position: absolute; left: 3px; right: 3px; top: -6px; height: 8px; border: 2px solid #f0c04a; border-bottom: none; border-radius: 6px 6px 0 0; }\n  .pip.off { background: rgba(253, 246, 234, 0.18); box-shadow: none; }\n  .pip.off::before { border-color: rgba(253, 246, 234, 0.18); }\n  #speedbar { width: 150px; height: 6px; border-radius: 99px; background: rgba(253, 246, 234, 0.16); overflow: hidden; margin-top: 8px; }\n  #speedfill { height: 100%; width: 0%; background: linear-gradient(90deg, #f0c04a, #ef7d4c); transition: width 0.12s linear; }\n  #combo { align-self: center; font-size: 14px; letter-spacing: 0.1em; text-transform: uppercase; color: #f0c04a; opacity: 0; transition: opacity 0.25s; }\n  #hint { align-self: center; font-size: 13px; letter-spacing: 0.08em; color: rgba(253, 246, 234, 0.62); }\n\n  /* ---------- Overlays ---------- */\n  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 40%, rgba(20, 26, 44, 0.42), rgba(10, 14, 26, 0.86)); backdrop-filter: blur(4px); z-index: 5; pointer-events: none; }\n  #overlay .card { pointer-events: auto; }\n  #overlay.showroom { background: linear-gradient(0deg, rgba(10, 14, 26, 0.72), rgba(10, 14, 26, 0.06)); backdrop-filter: none; place-items: end center; padding-bottom: 26px; }\n  #overlay.showroom .card { padding: 20px 24px 22px; background: rgba(18, 24, 42, 0.6); }\n  #overlay.showroom .keys { display: none; }\n  #overlay.showroom h1 { font-size: clamp(24px, 3.4vw, 32px); }\n  #overlay.showroom .sub { font-size: 14px; margin-bottom: 18px; }\n  #overlay.hidden { display: none; }\n  .card { width: min(520px, 90vw); text-align: center; padding: 34px 30px 30px; border-radius: 22px; background: rgba(18, 24, 42, 0.72); border: 1px solid rgba(253, 246, 234, 0.16); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); }\n  .kicker { font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: #f0c04a; }\n  h1 { margin: 10px 0 6px; font-size: clamp(34px, 6vw, 52px); line-height: 0.98; font-weight: 700; letter-spacing: -0.02em; }\n  .sub { margin: 0 auto; max-width: 40ch; font-size: 15px; line-height: 1.55; color: rgba(253, 246, 234, 0.74); text-wrap: pretty; }\n  .keys { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 22px 0 24px; }\n  .key { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 13px; color: rgba(253, 246, 234, 0.8); background: rgba(253, 246, 234, 0.07); border: 1px solid rgba(253, 246, 234, 0.14); border-radius: 10px; padding: 8px 12px; }\n  .key b { font-weight: 700; color: #fdf6ea; }\n  button { font: inherit; font-weight: 700; font-size: 16px; letter-spacing: 0.04em; color: #1b1408; background: linear-gradient(180deg, #ffd772, #f0b03c); border: none; border-radius: 12px; padding: 14px 30px; cursor: pointer; box-shadow: 0 10px 26px rgba(240, 176, 60, 0.32); }\n  button:hover { filter: brightness(1.06); }\n  button:active { transform: translateY(1px); }\n  .stats { display: flex; justify-content: center; gap: 30px; margin: 18px 0 26px; }\n  .stat .label { justify-content: center; }\n  .stat .value { font-size: 26px; }\n  #flash { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px rgba(214, 64, 52, 0); transition: box-shadow 0.35s; z-index: 4; }\n  #flash.on { box-shadow: inset 0 0 140px rgba(214, 64, 52, 0.85); transition: box-shadow 0.05s; }\n  @media (max-width: 620px) {\n    .value { font-size: 22px; }\n    .panel { min-width: 92px; padding: 10px 12px; }\n    #speedbar { width: 96px; }\n  }\n</style>\n\n\n\n\n</head>\n<body>\n\n<div id=\"stage\"><canvas id=\"scene\"></canvas></div>\n\n<div id=\"flash\"></div>\n\n<div id=\"hud\">\n  <div class=\"row\">\n    <div class=\"panel\">\n      <span class=\"label\">Score</span>\n      <span class=\"value\" id=\"score\">0</span>\n      <div id=\"lives\"></div>\n    </div>\n    <div class=\"panel\" style=\"align-items:flex-end;text-align:right\">\n      <span class=\"label\">Speed</span>\n      <span class=\"value\" id=\"speed\">0<small>km/h</small></span>\n      <div id=\"speedbar\"><div id=\"speedfill\"></div></div>\n    </div>\n  </div>\n  <div id=\"combo\"></div>\n  <div id=\"hint\">← → steer &nbsp;·&nbsp; ↑ boost &nbsp;·&nbsp; ↓ brake &nbsp;·&nbsp; C camera &nbsp;·&nbsp; P inspect</div>\n</div>\n\n<div id=\"overlay\">\n  <div class=\"card\">\n    <div class=\"kicker\" id=\"ov-kicker\">Coastal Highway 1</div>\n    <h1 id=\"ov-titl st pick = (arr) => arr[(Math.random() * arr.length) | 0];\n\n/* Gentle S-curve of the highway. `w` = metres travelled along the road. */\nfunction curveX(w) {\n  return Math.sin(w * 0.0042) * 16 + Math.sin(w * 0.0017 + 1.7) * 11;\n}\nfunction curveSlope(w) {\n  return (curveX(w + 3) - curveX(w - 3)) / 6;\n}\n/* Local z (camera space, forward = -z) of a point that sits at road metre w. */\nconst zOf = (w, dist) => dist - w;\nconst wOf = (z, dist) => dist - z;\n\n/* ------------------------------------------------- 2. RENDERER / SCENE / SKY */\nconst canvas = document.getElementById(\"scene\");\nconst renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: \"high-performance\" });\nrenderer.setPixelRatio(Math.min(devicePixelRatio, 2));\nrenderer.outputColorSpace = THREE.SRGBColorSpace;\nrenderer.toneMapping = THREE.ACESFilmicToneMapping;\nrenderer.toneMappingExposure = 1.05;\n\nconst scene = new THREE.Scene();\nconst HAZE = new THREE.Color(0xf0c898);\nscene.fog = new THREE.Fog(HAZE, 120, 430);\n\nconst camera = new THREE.PerspectiveCamera(64, 1, 0.1, 3000);\ncamera.position.set(0, 3.4, 8);\n\n/* --- sky dome: vertical sunset gradient painted on a canvas texture --- */\nfunction skyTexture() {\n  const c = document.createElement(\"canvas\");\n  c.width = 8; c.height = 512;\n  const g = c.getContext(\"2d\").createLinearGradient(0, 0, 0, 512);\n  g.addColorStop(0.00, \"#26365f\");\n  g.addColorStop(0.30, \"#5b6285\");\n  g.addColorStop(0.52, \"#c98a68\");\n  g.addColorStop(0.68, \"#eeae6f\");\n  g.addColorStop(0.80, \"#f7d6a2\");\n  g.addColorStop(1.00, \"#f3c489\");\n  const ctx = c.getContext(\"2d\");\n  ctx.fillStyle = g; ctx.fillRect(0, 0, 8, 512);\n  const t = new THREE.CanvasTexture(c);\n  t.colorSpace = THREE.SRGBColorSpace;\n  return t;\n}\nconst sky = new THREE.Mesh(\n  new THREE.SphereGeometry(1400, 32, 20),\n  new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide, depthWrite: false, fog: false })\n);\nsky.name = \"sky\";\nscene.add(sky);\n\n/* the same gradient, pre-filtered, becomes the ambient environment */\n{\n  const pmrem = new THREE.PMREMGenerator(renderer);\n  const envScene = new THREE.Scene();\n  envScene.add(new THREE.Mesh(\n    new THREE.SphereGeometry(60, 32, 20),\n    new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide })\n  ));\n  scene.environment = pmrem.fromScene(envScene, 0, 1, 200).texture;\n  scene.environmentIntensity = 0.9;\n  pmrem.dispose();\n}\n\n/* --- sun + glow, low on the horizon --- */\nfunction glowTexture(inner, outer) {\n  const c = document.createElement(\"canvas\");\n  c.width = c.height = 128;\n  const ctx = c.getContext(\"2d\");\n  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);\n  g.addColorStop(0, inner); g.addColorStop(0.35, outer); g.addColorStop(1, \"rgba(255,220,150,0)\");\n  ctx.fillStyle = g; ctx.fillRect(0, 0, 128, 128);\n  const t = new THREE.CanvasTexture(c);\n  t.colorSpace = THREE.SRGBColorSpace;\n  return t;\n}\nconst sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({\n  map: glowTexture(\"rgba(255,248,225,1)\", \"rgba(255,193,120,0.4)\"),\n  blending: THREE.AdditiveBlending, depthWrite: false, fog: false,\n}));\nsunGlow.scale.set(430, 430, 1);\nscene.add(sunGlow);\n\nconst sunDisc = new THREE.Sprite(new THREE.SpriteMaterial({\n  map: glowTexture(\"rgba(255,252,240,1)\", \"rgba(255,226,170,0.9)\"),\n  blending: THREE.AdditiveBlending, depthWrite: false, fog: false,\n}));\nsunDisc.scale.set(150, 150, 1);\nscene.add(sunDisc);\n\n/* --- lighting: warm low sun + cool sky fill --- */\nconst sun = new THREE.DirectionalLight(0xffd7a0, 2.2);\nsun.position.set(-60, 26, -160);\nscene.add(sun);\nscene.add(new THREE.HemisphereLight(0xbcd8f5, 0xa07f52, 1.35));\nconst rim = new THREE.DirectionalLight(0xffe6c8, 1.35);\nrim.position.set(6, 22, 70);\nscene.add(rim);\n\n/* ---------------------------------- 3. ROAD, TERRAIN, OCEAN, ROADSIDE PROPS */\n\n/* Asphalt texture: two solid yellow centre lines + white edge lines, 24 m tall */\nfunction roadTexture() {\n  const W = 512, H = 512;\n  const c = document.createElement(\"canvas\");\n  c.width = W; c.height = H;\n  const ctx = c.getContext(\"2d\");\n  ctx.fillStyle = \"#3a3a41\"; ctx.fillRect(0, 0, W, H);\n  // grain\n  for (let i = 0; i < 5200; i++) {\n    const a = Math.random() * 0.06;\n    ctx.fillStyle = Math.random() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a})`;\n    ctx.fillRect(Math.random() * W, Math.random() * H, 3, 3);\n  }\n  // patch seams\n  ctx.strokeStyle = \"rgba(0,0,0,0.16)\"; ctx.lineWidth = 3;\n  ctx.beginPath(); ctx.moveTo(0, H * 0.5); ctx.lineTo(W, H * 0.5); ctx.stroke();\n  // double yellow centre\n  ctx.fillStyle = \"#e0b02c\";\n  ctx.fillRect(W * 0.5 - 13, 0, 9, H);\n  ctx.fillRect(W * 0.5 + 4, 0, 9, H);\n  // white edges\n  ctx.fillStyle = \"#efe6d6\";\n  ctx.fillRect(W * 0.035, 0, 8, H);\n  ctx.fillRect(W * 0.965 - 8, 0, 8, H);\n  // dashed lane hints\n  ctx.fillStyle = \"rgba(239,230,214,0.55)\";\n  for (let y = 0; y < H; y += 128) {\n    ctx.fillRect(W * 0.26, y, 6, 64);\n    ctx.fillRect(W * 0.74 - 6, y, 6, 64);\n  }\n  const t = new THREE.CanvasTexture(c);\n  t.colorSpace = THREE.SRGBColorSpace;\n  t.wrapS = t.wrapT = THREE.RepeatWrapping;\n  t.anisotropy = renderer.capabilities.getMaxAnisotropy();\n  return t;\n}\n\n/* A ribbon that follows the road spine. Used for asphalt and for the land. */\nfunction makeRibbon({ left, right, y, material, name, tile }) {\n  const n = CFG.roadSegments;\n  const geo = new THREE.BufferGeometry();\n  const pos = new Float32Array((n + 1) * 2 * 3);\n  const uv = new Float32Array((n + 1) * 2 * 2);\n  const idx = [];\n  for (let i = 0; i < n; i++) {\n    const a = i * 2, b = a + 1, c2 = a + 2, d = a + 3;\n    idx.push(a, b, c2, b, d, c2);\n  }\n  geo.setAttribute(\"position\", new THREE.BufferAttribute(pos, 3));\n  geo.setAttribute(\"uv\", new THREE.BufferAttribute(uv, 2));\n  geo.setIndex(idx);\n  const mesh = new THREE.Mesh(geo, material);\n  mesh.name = name;\n  mesh.frustumCulled = false;\n  mesh.userData = { left, right, y, tile: tile || 24 };\n  return mesh;\n}\n\nfunction updateRibbon(mesh, dist) {\n  const { left, right, y, tile } = mesh.userData;\n  const pos = mesh.geometry.attributes.position.array;\n  const uv = mesh.geometry.attributes.uv.array;\n  const n = CFG.roadSegments;\n  const span = CFG.viewAhead + CFG.viewBehind;\n  for (let i = 0; i <= n; i++) {\n    const z = CFG.viewBehind - (i / n) * span;      // +z behind → -z ahead\n    const w = wOf(z, dist);\n    const cx = curveX(w);\n    const o = i * 6, u = i * 4;\n    pos[o] = cx + left;  pos[o + 1] = y; pos[o + 2] = z;\n    pos[o + 3] = cx + right; pos[o + 4] = y; pos[o + 5] = z;\n    uv[u] = 0; uv[u + 1] = w / tile;\n    uv[u + 2] = 1; uv[u + 3] = w / tile;\n  }\n  mesh.geometry.attributes.position.needsUpdate = true;\n  mesh.geometry.attributes.uv.needsUpdate = true;\n  mesh.geometry.computeVertexNormals();\n}\n\nconst roadMat = new THREE.MeshStandardMaterial({ map: roadTexture(), roughness: 0.82, metalness: 0.04 });\nroadMat.name = \"asphalt\";\nconst road = makeRibbon({ left: -CFG.roadHalf - 1.6, right: CFG.roadHalf + 1.6, y: 0, material: roadMat, name: \"road\", tile: 24 });\nscene.add(road);\n\n/* land: wide shelf under the road — ocean shows past its left edge */\nconst landMat = new THREE.MeshStandardMaterial({ color: PALETTE.sand, roughness: 1 });\nlandMat.name = \"coast_land\";\nconst land = makeRibbon({ left: -15, right: 420, y: -0.14, material: landMat, name: \"land\", tile: 40 });\nscene.add(land);\n\n/* scrub strip on the inland side for colour separation */\nconst scrubMat = new THREE.MeshStandardMaterial({ color: 0x7c7c4c, roughness: 1 });\nscrubMat.name = \"scrub\";\nconst scrub = makeRibbon({ left: CFG.roadHalf + 3.4, right: 300, y: -0.1, material: scrubMat, name: \"scrub\", tile: 40 });\nscene.add(scrub);\n\n/* ocean */\nconst ocean = new THREE.Mesh(\n  new THREE.PlaneGeometry(4000, 4000),\n  new THREE.MeshStandardMaterial({ color: 0x3d5f7e, roughness: 0.22, metalness: 0.35 })\n);\nocean.material.name = \"ocean\";\nocean.rotation.x = -Math.PI / 2;\nocean.position.y = -3.2;\nscene.add(ocean);\n\nconst glint = new THREE.Sprite(new THREE.SpriteMaterial({\n  map: glowTexture(\"rgba(255,235,190,0.8)\", \"rgba(255,190,120,0.22)\"),\n  blending: THREE.AdditiveBlending, depthWrite: false, fog: false,\n}));\nglint.scale.set(190, 70, 1);\nscene.add(glint);\n\n/* ---- pooled roadside props ---- */\nconst props = new THREE.Group();\nprops.name = \"roadside\";\nscene.add(props);\n\nfunction respawnProp(p, dist, first) {\n  p.w = (first ? dist + rand(20, CFG.viewAhead) : Math.max(p.w + p.spacing, dist + CFG.viewAhead));\n}\n\n/* palm: bent trunk + alpha-mapped fronds */\nfunction frondTexture() {\n  const W = 256, H = 128;\n  const c = document.createElement(\"canvas\");\n  c.width = W; c.height = H;\n  const ctx = c.getContext(\"2d\");\n  ctx.clearRect(0, 0, W, H);\n  ctx.lineCap = \"round\";\n  // two opposed blades sharing a midrib: leaflets first, then the rib\n  const mid = (t) => H * 0.5 + Math.sin(t * Math.PI) * -8 + t * t * 26;\n  for (let i = 0; i <= 30; i++) {\n    const t = i / 30, x = 10 + t * (W - 20), y = mid(t);\n    const len = (Math.sin(Math.min(1, t * 1.1) * Math.PI) * 44 + 8) * (1 - t * 0.25);\n    ctx.lineWidth = 6;\n    ctx.strokeStyle = i % 2 ? \"#54803e\" : \"#446a33\";\n    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y - len * 0.55, x - 10, y - len); ctx.stroke();\n    ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y + len * 0.55, x - 10, y + len); ctx.stroke();\n  }\n  ctx.strokeStyle = \"#3a5b2c\"; ctx.lineWidth = 6;\n  ctx.beginPath();\n  for (let i = 0; i <= 30; i++) {\n    const t = i / 30, x = 10 + t * (W - 20);\n    i ? ctx.lineTo(x, mid(t)) : ctx.moveTo(x, mid(t));\n  }\n  ctx.stroke();\n  const t = new THREE.CanvasTexture(c);\n  t.colorSpace = THREE.SRGBColorSpace;\n  return t;\n}\nconst frondMat = new THREE.MeshStandardMaterial({\n  map: frondTexture(), transparent: true, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.9,\n});\nfrondMat.name = \"palm_frond\";\nconst trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b563c, roughness: 0.95 });\ntrunkMat.name = \"palm_trunk\";\nconst trunkGeo = new THREE.CylinderGeometry(0.16, 0.3, 1, 8, 1);\nconst frondGeo = new THREE.PlaneGeometry(6.4, 3.2);\n\nfunction buildPalm() {\n  const g = new THREE.Group();\n  const h = rand(7, 12);\n  const trunk = new THREE.Mesh(trunkGeo, trunkMat);\n  trunk.name = \"palm_trunk\";\n  trunk.scale.set(1, h, 1);\n  trunk.position.y = h / 2;\n  trunk.rotation.z = rand(-0.12, 0.12);\n  g.add(trunk);\n  const crown = new THREE.Group();\n  crown.position.y = h - 0.25;\n  for (let i = 0; i < 5; i++) {\n    const holder = new THREE.Group();\n    holder.rotation.y = (i / 5) * Math.PI * 2 + rand(-0.25, 0.25);\n    const f = new THREE.Mesh(frondGeo, frondMat);\n    f.name = \"palm_frond\";\n    f.rotation.x = -Math.PI / 2 + rand(0.35, 0.7);\n    f.position.y = rand(-0.15, 0.3);\n    holder.add(f);\n    crown.add(holder);\n  }\n  const nut = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), trunkMat);\n  nut.name = \"palm_crown_base\";\n  crown.add(nut);\n  g.add(crown);\n  return g;\n}\n\nconst palms = [];\nfor (let i = 0; i < CFG.palmCount; i++) {\n  const m = buildPalm();\n  const side = Math.random() < 0.9 ? 1 : -1;   // inland side, a few by the rail\n  const p = { mesh: m, offset: side * rand(CFG.roadHalf + 6, CFG.roadHalf + 34), spacing: rand(18, 46), w: 0 };\n  respawnProp(p, 0, true);\n  props.add(m);\n  palms.push(p);\n}\n\n/* guardrail on the ocean side */\nconst railMat = new THREE.MeshStandardMaterial({ color: 0xc8ccd2, roughness: 0.45, metalness: 0.6 });\nrailMat.name = \"guardrail\";\nconst postMat = new THREE.MeshStandardMaterial({ color: 0x8f949c, roughness: 0.7, metalness: 0.4 });\npostMat.name = \"rail_post\";\nconst railBeamGeo = new THREE.BoxGeometry(0.16, 0.42, 8.2);\nconst railPostGeo = new THREE.BoxGeometry(0.16, 1.05, 0.16);\nconst rails = [];\nfor (let i = 0; i < CFG.railCount; i++) {\n  const g = new THREE.Group();\n  const beam = new THREE.Mesh(railBeamGeo, railMat); beam.name = \"guardrail_beam\"; beam.position.y = 0.78;\n  const post = new THREE.Mesh(railPostGeo, postMat); post.name = \"guardrail_post\"; post.position.y = 0.52;\n  g.add(beam, post);\n  const p = { mesh: g, offset: -(CFG.roadHalf + 3.1), spacing: 8, w: 0 };\n  p.w = i * 8;\n  props.add(g);\n  rails.push(p);\n}\n\n/* far hills, hazy */\nconst hillMat = new THREE.MeshStandardMaterial({ color: 0xa4938c, roughness: 1 });\nhillMat.name = \"headland\";\nconst hills = [];\nfor (let i = 0; i < CFG.hillCount; i++) {\n  const h = new THREE.Mesh(new THREE.ConeGeometry(rand(70, 140), rand(26, 52), 5, 1), hillMat);\n  h.name = \"headland\";\n  h.rotation.y = rand(0, 3);\n  const p = { mesh: h, offset: rand(230, 420) * (Math.random() < 0.7 ? 1 : -1), spacing: rand(260, 460), w: 0 };\n  respawnProp(p, 0, true);\n  props.add(h);\n  hills.push(p);\n}\n\n/* ------------------------------------------------- 4. CAR + MASCOT (models) */\nconst M = {\n  body: new THREE.MeshStandardMaterial({ color: PALETTE.navy, roughness: 0.24, metalness: 0.62 }),\n  stripe: new THREE.MeshStandardMaterial({ color: PALETTE.gold, roughness: 0.3, metalness: 0.5 }),\n  dark: new THREE.MeshStandardMaterial({ color: PALETTE.navyDark, roughness: 0.55, metalness: 0.3 }),\n  rubber: new THREE.MeshStandardMaterial({ color: PALETTE.rubber, roughness: 0.85 }),\n  chrome: new THREE.MeshStandardMaterial({ color: 0x9aa3b0, roughness: 0.3, metalness: 0.9 }),\n  glass: new THREE.MeshPhysicalMaterial({ color: 0xdfeaf5, roughness: 0.06, metalness: 0, transparent: true, opacity: 0.34 }),\n  tail: new THREE.MeshStandardMaterial({ color: 0xff1e10, emissive: 0xff1405, emissiveIntensity: 1.15, roughness: 0.35 }),\n  head: new THREE.MeshStandardMaterial({ color: 0xfff3d0, emissive: 0xffe6b0, emissiveIntensity: 0.9, roughness: 0.3 }),\n  seat: new THREE.MeshStandardMaterial({ color: 0x2b2f3a, roughness: 0.8 }),\n  shadow: new THREE.MeshBasicMaterial({ color: 0x1a1408, transparent: true, opacity: 0.34, depthWrite: false }),\n  mascot: new THREE.MeshStandardMaterial({ color: PALETTE.mascotBody, roughness: 0.45 }),\n  shackle: new THREE.MeshStandardMaterial({ color: PALETTE.mascotShackle, roughness: 0.35, metalness: 0.45 }),\n  eyeWhite: new THREE.MeshStandardMaterial({ color: 0xfdfdfd, roughness: 0.35 }),\n  eyeIris: new THREE.MeshStandardMaterial({ color: 0x2b5fa8, roughness: 0.3 }),\n  ink: new THREE.MeshStandardMaterial({ color: 0x1b1b22, roughness: 0.6 }),\n};\nObject.entries(M).forEach(([k, v]) => { v.name = k; });\nM.body.envMapIntensity = 1.6;\nM.chrome.envMapIntensity = 1.0;\nM.stripe.envMapIntensity = 1.4;\n\n/* Ziplin badge plate for the rear panel */\nconst logoTex = new THREE.TextureLoader().load(LOGO_URL);\nlogoTex.colorSpace = THREE.SRGBColorSpace;\nlogoTex.anisotropy = renderer.capabilities.getMaxAnisotropy();\nM.badge = new THREE.MeshStandardMaterial({\n  map: logoTex, emissiveMap: logoTex, emissive: 0xffffff, emissiveIntensity: 0.22,\n  color: 0xf9f3e6, roughness: 0.32, metalness: 0.05,\n});\nM.badge.name = \"ziplin_badge\";\n\n/* Side profile of the roadster, extruded across the width. */\nfunction carHullGeometry(len = 4.5, width = 1.94) {\n  const s = new THREE.Shape();\n  const pts = [\n    [-len / 2 + 0.02, 0.26], [-len / 2, 0.86], [-len / 2 + 0.55, 1.03],\n    [-0.55, 1.07], [0.30, 1.02], [1.35, 0.80], [len / 2 - 0.20, 0.60],\n    [len / 2, 0.40], [len / 2 - 0.35, 0.22], [-len / 2 + 0.45, 0.20],\n  ];\n  s.moveTo(pts[0][0], pts[0][1]);\n  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i][0], pts[i][1]);\n  s.closePath();\n  const geo = new THREE.ExtrudeGeometry(s, {\n    depth: width - 0.22, bevelEnabled: true, bevelSize: 0.11, bevelThickness: 0.1, bevelSegments: 3, curveSegments: 6,\n  });\n  geo.translate(0, 0, -(width - 0.22) / 2);\n  geo.rotateY(Math.PI / 2);            // length now along -z (forward)\n  return geo;\n}\n\nconst hullGeo = carHullGeometry();\nconst wheelGeo = new THREE.CylinderGeometry(0.37, 0.37, 0.3, 22);\nconst rimGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.28, 12);\nconst tailGeo = new THREE.TorusGeometry(0.185, 0.055, 8, 20);\nconst hoopGeo = new THREE.TorusGeometry(0.26, 0.05, 8, 16, Math.PI);\nconst pipeGeo = new THREE.CylinderGeometry(0.075, 0.075, 0.3, 10);\n\nfunction buildWheel(x, z) {\n  const g = new THREE.Group();\n  const tyre = new THREE.Mesh(wheelGeo, M.rubber); tyre.name = \"tyre\";\n  const rimA = new THREE.Mesh(rimGeo, M.chrome); rimA.name = \"rim\";\n  g.add(tyre, rimA);\n  g.rotation.z = Math.PI / 2;\n  g.position.set(x, 0.37, z);\n  return g;\n}\n\n/**\n * Roadster. Original stylised design — navy body, gold pinstripe, open top.\n * @param {object} o {colour, stripe, mascot}\n */\nfunction buildCar(o = {}) {\n  const car = new THREE.Group();\n  car.name = o.name || \"roadster\";\n\n  const bodyMat = o.colour ? M.body.clone() : M.body;\n  if (o.colour) { bodyMat.color.set(o.colour); bodyMat.name = \"body_\" + o.colour.toString(16); }\n\n  const hull = new THREE.Mesh(hullGeo, bodyMat);\n  hull.name = \"hull\";\n  car.add(hull);\n\n  // gold pinstripe over the spine\n  const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 3.4), o.stripe === false ? bodyMat : M.stripe);\n  stripe.name = \"pinstripe\";\n  stripe.position.set(0, 1.075, -0.2);\n  car.add(stripe);\n\n  // cockpit well + seats\n  const well = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.42, 1.55), M.dark);\n  well.name = \"cockpit\";\n  well.position.set(0, 0.92, 0.42);\n  car.add(well);\n  [-0.42, 0.42].forEach((x, i) => {\n    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.5, 0.22), M.seat);\n    seat.name = \"seat_back_\" + i;\n    seat.position.set(x, 1.16, 1.02);\n    seat.rotation.x = -0.16;\n    car.add(seat);\n    const hoop = new THREE.Mesh(hoopGeo, bodyMat);\n    hoop.name = \"roll_hoop_\" + i;\n    hoop.position.set(x, 1.34, 1.22);\n    car.add(hoop);\n  });\n\n  // windscreen\n  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.42, 0.44), M.glass);\n  screen.name = \"windscreen\";\n  screen.position.set(0, 1.22, -0.42);\n  screen.rotation.x = -0.62;\n  car.add(screen);\n  const screenFrame = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.05, 0.06), M.dark);\n  screenFrame.name = \"screen_frame\";\n  screenFrame.position.set(0, 1.42, -0.55);\n  screenFrame.rotation.x = -0.62;\n  car.add(screenFrame);\n  car.userData.screenParts = [screen, screenFrame];\n\n  // wheels\n  const wheels = [buildWheel(-0.94, -1.42), buildWheel(0.94, -1.42), buildWheel(-0.99, 1.5), buildWheel(0.99, 1.5)];\n  wheels.forEach((w, i) => { w.name = \"wheel_\" + i; car.add(w); });\n\n  // lights\n  [-0.62, 0.62].forEach((x, i) => {\n    const surround = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.07, 16), M.dark);\n    surround.name = \"tail_surround_\" + i;\n    surround.rotation.x = Math.PI / 2;\n    surround.position.set(x, 0.82, 2.24);\n    car.add(surround);\n    const t = new THREE.Mesh(tailGeo, M.tail);\n    t.name = \"taillight_\" + i;\n    t.position.set(x, 0.82, 2.28);\n    car.add(t);\n    const h = new THREE.Mesh(new THREE.SphereGeometry(0.13, 12, 10), M.head);\n    h.name = \"headlight_\" + i;\n    h.position.set(x, 0.62, -2.16);\n    h.scale.set(1.5, 0.7, 0.6);\n    car.add(h);\n  });\n\n  // rear grille + quad pipes\n  const diffuser = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.24, 0.14), M.dark);\n  diffuser.name = \"diffuser\";\n  diffuser.position.set(0, 0.42, 2.2);\n  car.add(diffuser);\n  [-0.3, -0.1, 0.1, 0.3].forEach((x, i) => {\n    const p = new THREE.Mesh(pipeGeo, M.chrome);\n    p.name = \"exhaust_\" + i;\n    p.rotation.x = Math.PI / 2;\n    p.position.set(x, 0.4, 2.3);\n    car.add(p);\n  });\n\n  // mirrors\n  [-1.0, 1.0].forEach((x, i) => {\n    const m = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.1), bodyMat);\n    m.name = \"mirror_\" + i;\n    m.position.set(x, 1.16, -0.3);\n    car.add(m);\n  });\n\n  // contact shadow\n  const sh = new THREE.Mesh(new THREE.CircleGeometry(1.55, 24), M.shadow);\n  sh.name = \"contact_shadow\";\n  sh.rotation.x = -Math.PI / 2;\n  sh.position.y = 0.02;\n  sh.scale.set(1, 1.7, 1);\n  car.add(sh);\n\n  car.userData.wheels = wheels;\n  if (o.mascot) {\n    const driver = buildMascot();\n    driver.scale.setScalar(1.22);\n    driver.position.set(-0.42, 1.0, 0.6);\n    car.add(driver);\n    car.userData.driver = driver;\n\n    const wheelRim = new THREE.Mesh(new THREE.TorusGeometry(0.17, 0.032, 8, 18), M.ink);\n    wheelRim.name = \"steering_wheel\";\n    wheelRim.position.set(-0.42, 1.16, 0.02);\n    wheelRim.rotation.x = 1.15;\n    car.add(wheelRim);\n    car.userData.steeringWheel = wheelRim;\n\n    // Ziplin badge plate, centred on the rear panel\n    const frame = new THREE.Mesh(new THREE.BoxGeometry(1.26, 0.56, 0.05), M.dark);\n    frame.name = \"badge_frame\";\n    frame.position.set(0, 0.58, 2.37);\n    car.add(frame);\n    const badge = new THREE.Mesh(new THREE.PlaneGeometry(1.16, 0.46), M.badge);\n    badge.name = \"ziplin_badge\";\n    badge.position.set(0, 0.58, 2.405);\n    car.add(badge);\n    car.userData.badge = badge;\n  }\n  return car;\n}\n\n/** Padlock mascot: rounded gold body, blue shackle, big eyes, mitten hands. */\nfunction buildMascot() {\n  const g = new THREE.Group();\n  g.name = \"mascot\";\n\n  const body = new THREE.Mesh(new THREE.SphereGeometry(0.32, 24, 20), M.mascot);\n  body.name = \"mascot_body\";\n  body.scale.set(1, 1.12, 0.82);\n  body.position.y = 0.34;\n  g.add(body);\n\n  const keyhole = new THREE.Mesh(new THREE.CircleGeometry(0.055, 14), M.ink);\n  keyhole.name = \"keyhole\";\n  keyhole.position.set(0, 0.2, -0.265);\n  keyhole.rotation.y = Math.PI;\n  g.add(keyhole);\n\n  const shackle = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.055, 12, 22, Math.PI), M.shackle);\n  shackle.name = \"shackle\";\n  shackle.position.y = 0.63;\n  g.add(shackle);\n  [-0.2, 0.2].forEach((x, i) => {\n    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.18, 10), M.shackle);\n    leg.name = \"shackle_leg_\" + i;\n    leg.position.set(x, 0.55, 0);\n    g.add(leg);\n  });\n\n  // face\n  const face = new THREE.Group();\n  face.name = \"face\";\n  face.position.set(0, 0.4, -0.2);\n  [-0.115, 0.115].forEach((x, i) => {\n    const w = new THREE.Mesh(new THREE.SphereGeometry(0.082, 16, 14), M.eyeWhite);\n    w.name = \"eye_\" + i;\n    w.position.set(x, 0, 0);\n    w.scale.set(1, 1.12, 0.6);\n    face.add(w);\n    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.042, 14, 12), M.eyeIris);\n    iris.name = \"iris_\" + i;\n    iris.position.set(x, -0.004, -0.052);\n    iris.scale.set(1, 1, 0.6);\n    face.add(iris);\n    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.032, 0.05), M.ink);\n    brow.name = \"brow_\" + i;\n    brow.position.set(x, 0.115, -0.03);\n    brow.rotation.z = i === 0 ? 0.16 : -0.16;\n    face.add(brow);\n  });\n  const smile = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.017, 8, 16, Math.PI), M.ink);\n  smile.name = \"smile\";\n  smile.position.set(0, -0.13, -0.02);\n  smile.rotation.z = Math.PI;\n  smile.rotation.x = 0.2;\n  face.add(smile);\n  g.add(face);\n  g.userData.face = face;\n\n  // arms to the wheel\n  const arms = [];\n  [-1, 1].forEach((s, i) => {\n    const arm = new THREE.Group();\n    arm.name = \"arm_\" + i;\n    const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.05, 0.42, 10), M.mascot);\n    upper.name = \"arm_limb_\" + i;\n    upper.position.set(0, -0.16, -0.1);\n    upper.rotation.x = -0.95;\n    arm.add(upper);\n    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.078, 14, 12), M.mascot);\n    hand.name = \"hand_\" + i;\n    hand.position.set(0, -0.3, -0.32);\n    arm.add(hand);\n    arm.position.set(s * 0.24, 0.42, -0.1);\n    g.add(arm);\n    arms.push(arm);\n  });\n  g.userData.arms = arms;\n  return g;\n}\n\nconst player = buildCar({ mascot: true, name: \"player_roadster\" });\nscene.add(player);\n\n/* traffic pool — oncoming cars in the far lane, slow cars in ours */\nconst TRAFFIC_COLOURS = [0xb9412f, 0xe0e2e6, 0x2f6b4f, 0x8d8f96, 0x3b4a72, 0xd8a13c];\nconst traffic = [];\nfor (let i = 0; i < CFG.trafficCount; i++) {\n  const c = buildCar({ colour: pick(TRAFFIC_COLOURS), stripe: false, name: \"traffic_\" + i });\n  c.visible = false;\n  scene.add(c);\n  traffic.push({ mesh: c, w: 0, offset: 0, oncoming: false, speed: 0, live: false });\n}\n\n/* cones */\nconst coneMatA = new THREE.MeshStandardMaterial({ color: 0xe4602c, roughness: 0.7 });\nconeMatA.name = \"cone\";\nconst coneMatB = new THREE.MeshStandardMaterial({ color: 0xf3ece0, roughness: 0.7 });\nconeMatB.name = \"cone_band\";\nconst cones = [];\nfor (let i = 0; i < CFG.coneCount; i++) {\n  const g = new THREE.Group();\n  const c = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.82, 12), coneMatA);\n  c.name = \"cone\"; c.position.y = 0.41;\n  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.235, 0.14, 12), coneMatB);\n  band.name = \"cone_band\"; band.position.y = 0.48;\n  const base = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.07, 0.62), coneMatA);\n  base.name = \"cone_base\"; base.position.y = 0.035;\n  g.add(c, band, base);\n  g.visible = false;\n  scene.add(g);\n  cones.push({ mesh: g, w: 0, offset: 0, live: false });\n}\n\n/* pickups: floating keys (torus + shaft) */\nconst keyMat = new THREE.MeshStandardMaterial({ color: 0xf7cf58, emissive: 0xd39a1a, emissiveIntensity: 0.45, roughness: 0.28, metalness: 0.85 });\nkeyMat.name = \"key\";\nconst coins = [];\nfor (let i = 0; i < CFG.coinCount; i++) {\n  const g = new THREE.Group();\n  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.075, 10, 20), keyMat);\n  ring.name = \"key_ring\";\n  const shaft = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.52, 0.11), keyMat);\n  shaft.name = \"key_shaft\"; shaft.position.y = -0.5;\n  const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.1, 0.1), keyMat);\n  tooth.name = \"key_tooth\"; tooth.position.set(0.08, -0.66, 0);\n  g.add(ring, shaft, tooth);\n  g.visible = false;\n  scene.add(g);\n  coins.push({ mesh: g, w: 0, offset: 0, live: false });\n}\n\n\nconst ZIPLIN_BILLBOARD_MESSAGES = [\n  { kicker: \"ZIPLIN\", title: \"SIGN IN\", sub: \"Your links are waiting.\" },\n  { kicker: \"FEATURE\", title: \"SHORT LINKS\", sub: \"Create branded links in seconds.\" },\n  { kicker: \"FEATURE\", title: \"QR CODES\", sub: \"Dynamic QR codes you can edit anytime.\" },\n  { kicker: \"FEATURE\", title: \"BIO PAGES\", sub: \"One page for every important link.\" },\n  { kicker: \"FEATURE\", title: \"ANALYTICS\", sub: \"Track clicks, scans, devices and referrers.\" },\n  { kicker: \"FEATURE\", title: \"CAMPAIGNS\", sub: \"Organize every launch in one workspace.\" },\n  { kicker: \"FEATURE\", title: \"CUSTOM DOMAINS\", sub: \"Use branded domains for trusted links.\" },\n  { kicker: \"FEATURE\", title: \"FILE SHARING\", sub: \"Protected files with download tracking.\" },\n  { kicker: \"FEATURE\", title: \"MIGRATION\", sub: \"Move links with slug and conflict checks.\" },\n  { kicker: \"FEATURE\", title: \"WEBHOOKS\", sub: \"Send events to your tools in real time.\" },\n];\n\nfunction roundedRect(ctx, x, y, w, h, r) {\n  const radius = Math.min(r, w / 2, h / 2);\n  ctx.beginPath();\n  ctx.moveTo(x + radius, y);\n  ctx.lineTo(x + w - radius, y);\n  ctx.quadraticCurveTo(x + w, y, x + w, y + radius);\n  ctx.lineTo(x + w, y + h - radius);\n  ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);\n  ctx.lineTo(x + radius, y + h);\n  ctx.quadraticCurveTo(x, y + h, x, y + h - radius);\n  ctx.lineTo(x, y + radius);\n  ctx.quadraticCurveTo(x, y, x + radius, y);\n  ctx.closePath();\n}\n\nfunction fitBillboardText(ctx, text, maxWidth, startSize, weight) {\n  let size = startSize;\n  do {\n    ctx.font = weight + \" \" + size + \"px Space Grotesk, system-ui, sans-serif\";\n    if (ctx.measureText(text).width <= maxWidth || size <= 54) return size;\n    size -= 4;\n  } while (size > 0);\n  return size;\n}\n\nfunction makeBillboardTexture(message) {\n  const c = document.createElement(\"canvas\");\n  c.width = 1536;\n  c.height = 768;\n  const ctx = c.getContext(\"2d\");\n  ctx.fillStyle = \"#081C45\";\n  ctx.fillRect(0, 0, c.width, c.height);\n  ctx.fillStyle = \"#0E2F73\";\n  ctx.fillRect(0, 0, c.width, 104);\n  ctx.fillStyle = \"#F4B400\";\n  ctx.fillRect(0, 656, c.width, 112);\n  ctx.fillStyle = \"rgba(255,198,10,0.18)\";\n  ctx.fillRect(0, 104, c.width, 28);\n  ctx.fillStyle = \"#FFC60A\";\n  roundedRect(ctx, 92, 146, 280, 82, 40);\n  ctx.fill();\n  ctx.fillStyle = \"#081C45\";\n  ctx.font = \"700 40px Space Grotesk, system-ui, sans-serif\";\n  ctx.fillText(message.kicker, 130, 199);\n  ctx.fillStyle = \"#FFFFFF\";\n  const titleSize = fitBillboardText(ctx, message.title, 1320, 142, \"700\");\n  ctx.font = \"700 \" + titleSize + \"px Space Grotesk, system-ui, sans-serif\";\n  ctx.fillText(message.title, 90, 374);\n  ctx.fillStyle = \"#FFC60A\";\n  const subSize = fitBillboardText(ctx, message.sub, 1320, 60, \"500\");\n  ctx.font = \"500 \" + subSize + \"px Space Grotesk, system-ui, sans-serif\";\n  ctx.fillText(message.sub, 96, 510);\n  ctx.fillStyle = \"rgba(255,255,255,0.82)\";\n  ctx.font = \"700 40px Space Grotesk, system-ui, sans-serif\";\n  ctx.fillText(\"ziplin.io\", 96, 620);\n\n  const texture = new THREE.CanvasTexture(c);\n  texture.colorSpace = THREE.SRGBColorSpace;\n  texture.needsUpdate = true;\n  return texture;\n}\n\nfunction makeBillboardPanel(texture, direction) {\n  const panel = new THREE.Mesh(\n    new THREE.PlaneGeometry(9.8, 4.9),\n    new THREE.MeshBasicMaterial({ map: texture, side: THREE.FrontSide })\n  );\n  panel.name = direction > 0 ? \"ziplin_billboard_panel_front\" : \"ziplin_billboard_panel_back\";\n  panel.position.set(0, 3.85, direction * 0.045);\n  if (direction < 0) panel.rotation.y = Math.PI;\n  return panel;\n}\n\nfunction buildZiplinBillboard(messageIndex) {\n  const g = new THREE.Group();\n  g.name = \"ziplin_billboard\";\n  g.userData.messageIndex = messageIndex;\n  const texture = makeBillboardTexture(ZIPLIN_BILLBOARD_MESSAGES[messageIndex]);\n  const front = makeBillboardPanel(texture, 1);\n  const back = makeBillboardPanel(texture.clone(), -1);\n  const frameMat = new THREE.MeshStandardMaterial({ color: 0xf4b400, roughness: 0.45, metalness: 0.35 });\n  const postMat = new THREE.MeshStandardMaterial({ color: 0x081c45, roughness: 0.65, metalness: 0.2 });\n  const top = new THREE.Mesh(new THREE.BoxGeometry(10.15, 0.18, 0.24), frameMat);\n  top.position.set(0, 6.38, -0.05);\n  const bottom = top.clone();\n  bottom.position.y = 1.28;\n  const leftPost = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 3.9, 10), postMat);\n  leftPost.position.set(-4.25, 1.55, -0.08);\n  const rightPost = leftPost.clone();\n  rightPost.position.x = 4.25;\n  g.add(front, back, top, bottom, leftPost, rightPost);\n  return g;\n}\n\nfunction setBillboardMessage(entry, index) {\n  entry.messageIndex = index % ZIPLIN_BILLBOARD_MESSAGES.length;\n  const texture = makeBillboardTexture(ZIPLIN_BILLBOARD_MESSAGES[entry.messageIndex]);\n  const front = entry.mesh.getObjectByName(\"ziplin_billboard_panel_front\");\n  const back = entry.mesh.getObjectByName(\"ziplin_billboard_panel_back\");\n  if (front) {\n    if (front.material.map) front.material.map.dispose();\n    front.material.map = texture;\n    front.material.needsUpdate = true;\n  }\n  if (back) {\n    if (back.material.map) back.material.map.dispose();\n    back.material.map = texture.clone();\n    back.material.needsUpdate = true;\n  }\n}\n\nconst billboards = [];\nfor (let i = 0; i < 10; i++) {\n  const mesh = buildZiplinBillboard(i % ZIPLIN_BILLBOARD_MESSAGES.length);\n  scene.add(mesh);\n  billboards.push({\n    mesh,\n    w: 82 + i * 105,\n    offset: i % 2 === 0 ? CFG.roadHalf + 6.4 : -CFG.roadHalf - 6.4,\n    spacing: 105,\n    messageIndex: i % ZIPLIN_BILLBOARD_MESSAGES.length,\n  });\n}\n\n/* --------------------------------------------------------- 5. GAME + INPUT */\nconst HUD = {\n  score: document.getElementById(\"score\"),\n  speed: document.getElementById(\"speed\"),\n  fill: document.getElementById(\"speedfill\"),\n  lives: document.getElementById(\"lives\"),\n  combo: document.getElementById(\"combo\"),\n  hint: document.getElementById(\"hint\"),\n};\nconst OV = {\n  root: document.getElementById(\"overlay\"),\n  kicker: document.getElementById(\"ov-kicker\"),\n  title: document.getElementById(\"ov-title\"),\n  sub: document.getElementById(\"ov-sub\"),\n  stats: document.getElementById(\"ov-stats\"),\n  score: document.getElementById(\"ov-score\"),\n  dist: document.getElementById(\"ov-dist\"),\n  best: document.getElementById(\"ov-best\"),\n  keys: document.getElementById(\"ov-keys\"),\n  btn: document.getElementById(\"ov-btn\"),\n};\nOV.stats.style.display = \"none\";\n\nconst BEST_KEY = \"coastRunner.best\";\nconst state = {\n  mode: \"menu\",          // menu | playing | paused | over\n  dist: 0,\n  speed: CFG.speedMin,\n  offset: 4.2,           // lateral position, + = inland lane\n  steer: 0,\n  score: 0,\n  lives: CFG.lives,\n  invuln: 0,\n  shake: 0,\n  best: Number(localStorage.getItem(BEST_KEY) || 0),\n  t: 0,\n  cam: 0,                // index into CAM_MODES\n  introT: 0,\n};\n\nconst CAM_MODES = [\"chase\", \"side\", \"hood\"];\nconst CAM_NAMES = { chase: \"Chase\", side: \"Cinematic\", hood: \"Cockpit\", intro: \"Intro\", showroom: \"Showroom\" };\nconst orbit = { az: 2.55, el: 0.22, r: 7.2 };\n\nconst keys = new Set();\naddEventListener(\"keydown\", (e) => {\n  if ([\"ArrowUp\", \"ArrowDown\", \"ArrowLeft\", \"ArrowRight\", \" \"].includes(e.key)) e.preventDefault();\n  keys.add(e.key.toLowerCase());\n  if (e.key.toLowerCase() === \"p\") togglePause();\n  if (e.key.toLowerCase() === \"c\" && state.mode === \"playing\") {\n    state.cam = (state.cam + 1) % CAM_MODES.length;\n    flashCombo(CAM_NAMES[CAM_MODES[state.cam]] + \" camera\");\n  }\n  if (e.key === \"Enter\" && state.mode !== \"playing\") startRun();\n  if (e.key.toLowerCase() === \"r\" && state.mode === \"over\") startRun();\n}, { passive: false });\naddEventListener(\"keyup\", (e) => keys.delete(e.key.toLowerCase()));\naddEventListener(\"blur\", () => { keys.clear(); if (state.mode === \"playing\") togglePause(); });\n\n/* touch: drag anywhere to steer, tap upper half to boost */\nlet touchSteer = 0, touchBoost = false;\nfunction touchMove(e) {\n  const t = e.touches[0];\n  if (!t) return;\n  touchSteer = clamp(((t.clientX / innerWidth) - 0.5) * 2.6, -1, 1);\n  touchBoost = t.clientY < innerHeight * 0.45;\n}\ncanvas.addEventListener(\"touchstart\", (e) => { if (state.mode === \"playing\") { touchMove(e); e.preventDefault(); } }, { passive: false });\ncanvas.addEventListener(\"touchmove\", touchMove, { passive: true });\ncanvas.addEventListener(\"touchend\", () => { touchSteer = 0; touchBoost = false; });\n\nOV.btn.addEventListener(\"click\", startRun);\n\n/* drag / pinch to orbit the car while paused (showroom) */\nlet dragging = false, lastPX = 0, lastPY = 0;\ncanvas.addEventListener(\"pointerdown\", (e) => { dragging = true; lastPX = e.clientX; lastPY = e.clientY; });\naddEventListener(\"pointerup\", () => { dragging = false; });\naddEventListener(\"pointercancel\", () => { dragging = false; });\naddEventListener(\"pointermove\", (e) => {\n  if (!dragging || state.mode !== \"paused\") return;\n  orbit.az -= (e.clientX - lastPX) * 0.0065;\n  orbit.el = clamp(orbit.el + (e.clientY - lastPY) * 0.0042, -0.04, 0.85);\n  lastPX = e.clientX; lastPY = e.clientY;\n});\ncanvas.addEventListener(\"wheel\", (e) => {\n  if (state.mode !== \"paused\") return;\n  e.preventDefault();\n  orbit.r = clamp(orbit.r + e.deltaY * 0.008, 3.4, 15);\n}, { passive: false });\n\nfunction togglePause() {\n  if (state.mode === \"playing\") {\n    state.mode = \"paused\";\n    OV.root.classList.add(\"showroom\");\n    showOverlay({ kicker: \"Showroom\", title: \"Ziplin Roadster\", sub: \"Drag to orbit the car, scroll or pinch to zoom. P or the button to get back on the road.\", btn: \"Resume run\", stats: false });\n  } else if (state.mode === \"paused\") {\n    OV.root.classList.remove(\"showroom\");\n    hideOverlay();\n    state.mode = \"playing\";\n  }\n}\n\nfunction showOverlay({ kicker, title, sub, btn, stats }) {\n  OV.kicker.textContent = kicker;\n  OV.title.textContent = title;\n  OV.sub.textContent = sub;\n  OV.btn.textContent = btn;\n  OV.stats.style.display = stats ? \"flex\" : \"none\";\n  OV.keys.style.display = stats ? \"none\" : \"flex\";\n  OV.root.classList.remove(\"hidden\");\n}\nfunction hideOverlay() { OV.root.classList.add(\"hidden\"); }\n\nfunction startRun() {\n  if (state.mode === \"paused\") { togglePause(); return; }\n  state.mode = \"playing\";\n  state.dist = 0; state.speed = CFG.speedMin; state.offset = 4.2; state.steer = 0;\n  state.score = 0; state.lives = CFG.lives; state.invuln = 0; state.shake = 0;\n  state.introT = CFG.introTime; state.cam = 0;\n  traffic.forEach((t) => { t.live = false; t.mesh.visible = false; });\n  cones.forEach((c) => { c.live = false; c.mesh.visible = false; });\n  coins.forEach((c) => { c.live = false; c.mesh.visible = false; });\n  palms.forEach((p) => respawnProp(p, 0, true));\n  hills.forEach((p) => respawnProp(p, 0, true));\n  rails.forEach((p, i) => { p.w = i * 8; });\n  hideOverlay();\n  drawLives();\n}\n\nfunction gameOver() {\n  state.mode = \"over\";\n  OV.root.classList.remove(\"showroom\");\n  const km = state.dist / 1000;\n  state.score = Math.floor(state.score);\n  if (state.score > state.best) {\n    state.best = state.score;\n    localStorage.setItem(BEST_KEY, String(state.best));\n  }\n  OV.score.textContent = state.score.toLocaleString();\n  OV.dist.textContent = km.toFixed(2) + \" km\";\n  OV.best.textContent = state.best.toLocaleString();\n  showOverlay({\n    kicker: \"Run ended\",\n    title: km > 3 ? \"Long haul\" : \"Back to the depot\",\n    sub: \"Keys are worth 250. Clean overtakes add up while you keep the throttle down.\",\n    btn: \"Drive again\",\n    stats: true,\n  });\n}\n\nfunction drawLives() {\n  HUD.lives.innerHTML = \"\";\n  for (let i = 0; i < CFG.lives; i++) {\n    const d = document.createElement(\"div\");\n    d.className = \"pip\" + (i < state.lives ? \"\" : \" off\");\n    HUD.lives.appendChild(d);\n  }\n}\ndrawLives();\n\nlet comboTimer = 0;\nfunction flashCombo(text) {\n  HUD.combo.textContent = text;\n  HUD.combo.style.opacity = \"1\";\n  comboTimer = 1.1;\n}\n\nconst flashEl = document.getElementById(\"flash\");\nfunction hit() {\n  if (state.invuln > 0) return;\n  state.lives -= 1;\n  state.invuln = 1.6;\n  state.speed = Math.max(CFG.speedMin * 0.55, state.speed * 0.45);\n  state.shake = 1;\n  drawLives();\n  flashEl.classList.add(\"on\");\n  setTimeout(() => flashEl.classList.remove(\"on\"), 90);\n  if (state.lives <= 0) gameOver();\n}\n\n/* --- spawning --------------------------------------------------------- */\nfunction spawnTraffic(t) {\n  const oncoming = Math.random() < 0.45;\n  t.oncoming = oncoming;\n  t.offset = oncoming ? rand(-CFG.roadHalf + 1.4, -1.6) : rand(1.6, CFG.roadHalf - 1.4);\n  t.speed = oncoming ? rand(22, 30) : rand(12, 20);\n  t.w = state.dist + rand(CFG.viewAhead * 0.55, CFG.viewAhead);\n  t.mesh.visible = true;\n  t.live = true;\n  t.passed = false;\n}\nfunction spawnCone(c) {\n  c.offset = rand(-CFG.roadHalf + 0.8, CFG.roadHalf - 0.8);\n  c.w = state.dist + rand(CFG.viewAhead * 0.5, CFG.viewAhead);\n  c.mesh.visible = true;\n  c.live = true;\n}\nfunction spawnCoin(c) {\n  c.offset = rand(-CFG.roadHalf + 1.2, CFG.roadHalf - 1.2);\n  c.w = state.dist + rand(CFG.viewAhead * 0.4, CFG.viewAhead);\n  c.mesh.visible = true;\n  c.live = true;\n}\n\n/* place any world object on the curving road */\nfunction placeOnRoad(mesh, w, offset, y) {\n  const cx = curveX(w);\n  const slope = curveSlope(w);\n  mesh.position.set(cx + offset, y === undefined ? 0 : y, zOf(w, state.dist));\n  mesh.rotation.y = -Math.atan(slope);\n  return mesh.position;\n}\n\n/* --------------------------------------------------------------- 6. LOOP */\nconst clock = new THREE.Clock();\nconst camLook = new THREE.Vector3(0, 1.7, -46);\nconst camDesired = new THREE.Vector3();\nconst camTarget = new THREE.Vector3();\n\nfunction resize() {\n  const w = innerWidth, h = innerHeight;\n  renderer.setSize(w, h, false);\n  camera.aspect = w / h;\n  camera.updateProjectionMatrix();\n}\naddEventListener(\"resize\", resize);\nresize();\n\nfunction update(dt) {\n  state.t += dt;\n  const intro = state.mode === \"playing\" && state.introT > 0;\n  const driving = state.mode === \"playing\" && !intro;\n  if (intro) {\n    state.introT -= dt;\n    state.speed = lerp(state.speed, 0, 1 - Math.pow(0.05, dt));\n    state.steer = lerp(state.steer, 0, 0.25);\n  }\n\n  /* ---- input ---- */\n  let steerIn = 0;\n  if (keys.has(\"arrowleft\") || keys.has(\"a\")) steerIn -= 1;\n  if (keys.has(\"arrowright\") || keys.has(\"d\")) steerIn += 1;\n  steerIn = clamp(steerIn + touchSteer, -1, 1);\n  const boosting = keys.has(\"arrowup\") || keys.has(\"w\") || touchBoost;\n  const braking = keys.has(\"arrowdown\") || keys.has(\"s\") || keys.has(\" \");\n\n  if (driving) {\n    /* ---- speed ---- */\n    const target = boosting ? CFG.speedMax : braking ? CFG.speedMin * 0.5 : lerp(CFG.speedMin, CFG.speedMax * 0.82, clamp(state.dist / 4000, 0, 1));\n    const rate = state.speed < target ? CFG.accel * (boosting ? 1.6 : 1) : (braking ? CFG.brake : CFG.accel * 1.4);\n    state.speed += clamp(target - state.speed, -rate * dt, rate * dt);\n\n    const offroad = Math.abs(state.offset) > CFG.roadHalf;\n    if (offroad) {\n      state.speed = Math.max(CFG.speedMin * 0.4, state.speed - CFG.offroadDrag * dt);\n      state.shake = Math.max(state.shake, 0.35);\n    }\n\n    /* ---- steering ---- */\n    state.steer = lerp(state.steer, steerIn, 1 - Math.pow(0.001, dt));\n    state.offset = clamp(state.offset + state.steer * CFG.steerSpeed * dt * (0.6 + state.speed / CFG.speedMax * 0.6), -CFG.roadHalf - 2.1, CFG.roadHalf + 2.6);\n\n    state.dist += state.speed * dt;\n    state.score += state.speed * dt * (boosting ? 1.6 : 1);\n    state.invuln = Math.max(0, state.invuln - dt);\n  }\n  state.shake = Math.max(0, state.shake - dt * 1.8);\n\n  /* ---- road + terrain ---- */\n  updateRibbon(road, state.dist);\n  updateRibbon(land, state.dist);\n  updateRibbon(scrub, state.dist);\n\n  /* ---- player car ---- */\n  const cx = curveX(state.dist);\n  const slope = curveSlope(state.dist);\n  const px = cx + state.offset;\n  player.position.set(px, 0, 0);\n  player.rotation.y = -Math.atan(slope) - state.steer * 0.11;\n  player.rotation.z = lerp(player.rotation.z, -state.steer * 0.045, 0.12);\n  const bounce = Math.sin(state.t * 26) * 0.012 * (state.speed / CFG.speedMax) + state.shake * Math.sin(state.t * 60) * 0.05;\n  player.position.y = bounce;\n  player.visible = state.invuln > 0 ? Math.sin(state.t * 40) > -0.4 : true;\n  player.userData.wheels.forEach((w, i) => {\n    w.children[0].rotation.y -= (state.speed / 0.37) * dt;\n    if (i < 2) w.rotation.y = state.steer * 0.4;\n  });\n  if (player.userData.steeringWheel) player.userData.steeringWheel.rotation.z = -state.steer * 0.7;\n\n  /* mascot: bob, lean into the corner, arms follow the wheel */\n  const driver = player.userData.driver;\n  if (driver) {\n    driver.position.y = 1.0 + Math.sin(state.t * 7) * 0.014;\n    driver.rotation.z = lerp(driver.rotation.z, state.steer * 0.16, 0.1);\n    driver.rotation.y = lerp(driver.rotation.y, -state.steer * 0.2, 0.1);\n    driver.userData.face.rotation.y = -state.steer * 0.25;\n    driver.userData.arms.forEach((arm, i) => {\n      arm.rotation.z = (i === 0 ? 1 : -1) * (0.12 + state.steer * (i === 0 ? 0.3 : 0.3));\n    });\n  }\n\n  /* ---- camera: chase / cinematic / hood, plus intro orbit and showroom ---- */\n  const mode = state.mode === \"paused\" ? \"showroom\" : intro ? \"intro\" : CAM_MODES[state.cam];\n  const wAhead = state.dist + 46;\n  camTarget.set(curveX(wAhead) + state.offset * 0.7, 1.7, zOf(wAhead, state.dist));\n\n  if (mode === \"intro\") {\n    const k = 1 - clamp(state.introT / CFG.introTime, 0, 1);\n    const e = k * k * (3 - 2 * k);\n    const a = lerp(3.0, 0.12, e), r = lerp(8.6, 7.0, e);\n    camDesired.set(px + Math.sin(a) * r, lerp(1.35, 2.45, e), Math.cos(a) * r);\n    camTarget.set(px, 1.05, lerp(0.6, -12, e));\n  } else if (mode === \"showroom\") {\n    if (!dragging) orbit.az += dt * 0.14;\n    camDesired.set(\n      px + Math.sin(orbit.az) * orbit.r * Math.cos(orbit.el),\n      1.0 + Math.sin(orbit.el) * orbit.r,\n      Math.cos(orbit.az) * orbit.r * Math.cos(orbit.el)\n    );\n    camTarget.set(px, -0.35, 0);\n  } else if (mode === \"hood\") {\n    camDesired.set(px, 1.62, 0.2);\n    camTarget.set(curveX(state.dist + 44) + state.offset * 0.2, 1.15, zOf(state.dist + 44, state.dist));\n  } else if (mode === \"side\") {\n    const a = 0.86 + Math.sin(state.t * 0.21) * 0.4;\n    camDesired.set(px + Math.sin(a) * 6.0, 1.72 + state.shake * 0.1, Math.cos(a) * 6.0);\n    camTarget.set(px + 1.1, 1.0, -3.4);\n  } else {\n    camDesired.set(curveX(state.dist - 6.5) + state.offset * 0.92, 2.22 + state.shake * 0.12, 6.5);\n  }\n\n  const ease = mode === \"showroom\" ? 0.22 : mode === \"hood\" ? 0.45 : 1 - Math.pow(0.004, dt);\n  if (player.userData.screenParts) player.userData.screenParts.forEach((p) => { p.visible = mode !== \"hood\"; });\n  camera.position.lerp(camDesired, ease);\n  camera.position.x += state.shake * Math.sin(state.t * 55) * 0.22;\n  camLook.lerp(camTarget, mode === \"showroom\" ? 0.3 : 1 - Math.pow(0.02, dt));\n  camera.lookAt(camLook);\n  if (mode === \"chase\" || mode === \"hood\") camera.rotation.z += -state.steer * 0.02;\n\n  /* sky + sun + ocean follow the camera so the horizon never runs out */\n  sky.position.set(camera.position.x, 0, camera.position.z);\n  ocean.position.set(camera.position.x, -3.2, camera.position.z - 600);\n  const sunX = camera.position.x - 120, sunZ = camera.position.z - 1100;\n  sunGlow.position.set(sunX, 62, sunZ);\n  sunDisc.position.set(sunX, 62, sunZ);\n  glint.position.set(sunX, -2.6, sunZ + 500);\n\n  /* ---- roadside props ---- */\n  for (const p of palms.concat(hills, rails)) {\n    if (zOf(p.w, state.dist) > CFG.viewBehind + 30) {\n      p.w += p.spacing * (p.spacing > 100 ? 1 : Math.ceil((CFG.viewAhead + CFG.viewBehind) / p.spacing));\n    }\n    placeOnRoad(p.mesh, p.w, p.offset, p.mesh.name === \"headland\" ? -20 : -0.1);\n  }\n\n\n  /* ---- Ziplin billboards ---- */\n  for (const b of billboards) {\n    if (zOf(b.w, state.dist) > CFG.viewBehind + 35) {\n      b.w += b.spacing * billboards.length;\n      setBillboardMessage(b, b.messageIndex + 1);\n    }\n    placeOnRoad(b.mesh, b.w, b.offset, 0);\n  }\n\n  /* ---- traffic ---- */\n  for (const t of traffic) {\n    if (!t.live) { if (driving && Math.random() < dt * 1.6) spawnTraffic(t); continue; }\n    t.w += (t.oncoming ? -t.speed : t.speed) * dt;\n    const z = zOf(t.w, state.dist);\n    if (z > CFG.viewBehind + 20 || z < -CFG.viewAhead - 120) { t.live = false; t.mesh.visible = false; continue; }\n    placeOnRoad(t.mesh, t.w, t.offset, 0);\n    if (t.oncoming) t.mesh.rotation.y += Math.PI;\n    t.mesh.userData.wheels.forEach((w) => { w.children[0].rotation.y -= (t.speed / 0.37) * dt; });\n    if (driving && Math.abs(z) < 2.9 && Math.abs(t.offset - state.offset) < 1.85) hit();\n    if (driving && !t.passed && z > 3) { t.passed = true; state.score += 60; }\n  }\n\n  /* ---- cones ---- */\n  for (const c of cones) {\n    if (!c.live) { if (driving && Math.random() < dt * 1.1) spawnCone(c); continue; }\n    const z = zOf(c.w, state.dist);\n    if (z > CFG.viewBehind + 20) { c.live = false; c.mesh.visible = false; continue; }\n    placeOnRoad(c.mesh, c.w, c.offset, 0);\n    if (driving && Math.abs(z) < 1.9 && Math.abs(c.offset - state.offset) < 1.25) { hit(); c.live = false; c.mesh.visible = false; }\n  }\n\n  /* ---- keys ---- */\n  for (const c of coins) {\n    if (!c.live) { if (driving && Math.random() < dt * 1.5) spawnCoin(c); continue; }\n    const z = zOf(c.w, state.dist);\n    if (z > CFG.viewBehind + 20) { c.live = false; c.mesh.visible = false; continue; }\n    placeOnRoad(c.mesh, c.w, c.offset, 1.5 + Math.sin(state.t * 2 + c.w) * 0.12);\n    c.mesh.rotation.y += dt * 2.4;\n    if (driving && Math.abs(z) < 2.4 && Math.abs(c.offset - state.offset) < 1.6) {\n      c.live = false; c.mesh.visible = false;\n      state.score += 250;\n      flashCombo(\"+250 key\");\n    }\n  }\n\n  /* ---- HUD ---- */\n  HUD.score.textContent = Math.floor(state.score).toLocaleString();\n  const kmh = Math.round(state.speed * 3.6);\n  HUD.speed.innerHTML = kmh + \"<small>km/h</small>\";\n  HUD.fill.style.width = clamp((state.speed / CFG.speedMax) * 100, 0, 100) + \"%\";\n  if (comboTimer > 0) {\n    comboTimer -= dt;\n    if (comboTimer <= 0) HUD.combo.style.opacity = \"0\";\n  }\n  HUD.hint.style.opacity = state.dist > 240 ? \"0\" : \"0.9\";\n  HUD.combo.style.display = state.mode === \"paused\" ? \"none\" : \"block\";\n}\n\nfunction frame() {\n  const dt = Math.min(clock.getDelta(), 1 / 30);\n  update(dt);\n  renderer.render(scene, camera);\n  requestAnimationFrame(frame);\n}\n\nshowOverlay({\n  kicker: \"Coastal Highway 1\",\n  title: \"Coast Runner\",\n  sub: \"Keep the mascot on the road at sunset. Grab keys, slip past oncoming traffic, and hold the throttle as long as your nerve lasts.\",\n  btn: \"Start driving\",\n  stats: false,\n});\nframe();\n<\u002Fscript>\n\n\n</body></html>"
